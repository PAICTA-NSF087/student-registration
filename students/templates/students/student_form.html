{% extends 'students/base.html'%}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save Student</button>
    <a href="{% url 'student_list' %}">Cancel</a>
</form>
{% endblock %}
